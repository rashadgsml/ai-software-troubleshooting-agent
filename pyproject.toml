[project]
name = "troubleshooting-agent"
version = "0.1.0"
description = "AI-powered software troubleshooting agent (Claude + FastAPI + MCP + PostgreSQL)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "anthropic>=0.40",
    "mcp>=2.3,<3",  # v2 API: MCPServer / Client (FastMCP was renamed)
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["eval: real-LLM agent evaluations (opt-in, costs money)"]
addopts = "-m 'not eval'"
