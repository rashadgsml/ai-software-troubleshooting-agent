services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: troubleshooter
      POSTGRES_PASSWORD: troubleshooter
      POSTGRES_DB: troubleshooter
    ports:
      - "5433:5432"  # host 5433: avoids clashing with a locally installed Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U troubleshooter"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://troubleshooter:troubleshooter@db:5432/troubleshooter
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/srv/app
      - ./demo_app:/srv/demo_app

volumes:
  pgdata:
