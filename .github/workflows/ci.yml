name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: troubleshooter
          POSTGRES_PASSWORD: troubleshooter
          POSTGRES_DB: troubleshooter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U troubleshooter"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://troubleshooter:troubleshooter@localhost:5432/troubleshooter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      # Free tests only: scripted Claude, real Postgres. Real-API evals are opt-in and never run in CI.
      - run: pytest -q
